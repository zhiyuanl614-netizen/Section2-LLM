<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Section2-LLM 方法流程架构图</title>
  <desc id="desc">逐阶段工作流：PDF 上传隔离、清洗分块、本地 BM25、待集成的 LLM 抽取、人工核验、综合与图表。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7187a0"/></marker>
  </defs>
  <rect x="0" y="0" width="1280" height="920" rx="22" fill="#f5f8fb"/>
  <text x="54" y="54" fill="#172b45" font-size="28" font-weight="700" font-family="sans-serif">逐阶段研究工作流 · 方法流程架构</text>
  <text x="54" y="82" fill="#74849a" font-size="14" font-family="sans-serif">每一步单独确认并保留 run manifest；未接入或依赖不足时显示未就绪，不生成替代性结果。</text>

  <rect x="62" y="133" width="356" height="120" rx="16" fill="#eaf2fd" stroke="#5d8ec5" stroke-width="2"/>
  <circle cx="94" cy="166" r="18" fill="#3977c5"/><text x="88" y="172" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">01</text>
  <text x="125" y="165" fill="#244a72" font-size="16" font-weight="700" font-family="sans-serif">上传与来源登记</text>
  <text x="86" y="198" fill="#4f6680" font-size="13" font-family="sans-serif">Loopback 本机；新 run 隔离，逐 PDF SHA-256</text>
  <text x="86" y="225" fill="#328268" font-size="12" font-weight="700" font-family="sans-serif">已接入 · 显式选择文件并上传</text>

  <path d="M420 193 L478 193" fill="none" stroke="#7187a0" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="492" y="133" width="356" height="120" rx="16" fill="#e8f6f1" stroke="#72b69e" stroke-width="2"/>
  <circle cx="524" cy="166" r="18" fill="#2c9c83"/><text x="512" y="172" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">02</text>
  <text x="555" y="165" fill="#246751" font-size="16" font-weight="700" font-family="sans-serif">PDF 清洗与证据分块</text>
  <text x="516" y="198" fill="#4e7065" font-size="13" font-family="sans-serif">Step 1 zones / slice → Step 2 evidence blocks</text>
  <text x="516" y="225" fill="#328268" font-size="12" font-weight="700" font-family="sans-serif">本机真实脚本 · 缺依赖时失败关闭</text>

  <path d="M850 193 L908 193" fill="none" stroke="#7187a0" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="922" y="133" width="300" height="120" rx="16" fill="#fff5e5" stroke="#d4a451" stroke-width="2"/>
  <circle cx="954" cy="166" r="18" fill="#c9872b"/><text x="942" y="172" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">03</text>
  <text x="985" y="165" fill="#81591d" font-size="16" font-weight="700" font-family="sans-serif">本地 BM25 索引</text>
  <text x="946" y="198" fill="#7f6a48" font-size="13" font-family="sans-serif">逐证据检索；公式风险标签保留</text>
  <text x="946" y="225" fill="#a36d24" font-size="12" font-weight="700" font-family="sans-serif">部分就绪 · Dense / 新图谱未接入</text>

  <path d="M1072 255 L1072 322" fill="none" stroke="#7187a0" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="808" y="337" width="414" height="132" rx="16" fill="#f6f3fb" stroke="#ab9bd0" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="842" cy="371" r="18" fill="#7c70b4"/><text x="830" y="377" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">04</text>
  <text x="873" y="370" fill="#574785" font-size="16" font-weight="700" font-family="sans-serif">LLM 抽取与 Critic</text>
  <text x="832" y="404" fill="#6b6283" font-size="13" font-family="sans-serif">需版本化 v1.2 runner、A/B 模型配置与输入预检</text>
  <text x="832" y="435" fill="#a04f45" font-size="12" font-weight="700" font-family="sans-serif">未接入此网页工作流 · 批量云端文本未获授权</text>
  <text x="832" y="455" fill="#8a7eaa" font-size="11" font-family="sans-serif">模型设置目前仅供单次 QA；不等于批量抽取已可运行</text>

  <path d="M806 403 L716 403 L716 549" fill="none" stroke="#7187a0" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="492" y="565" width="356" height="122" rx="16" fill="#fffaf1" stroke="#d9b36e" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="524" cy="598" r="18" fill="#c9872b"/><text x="512" y="604" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">05</text>
  <text x="555" y="597" fill="#81591d" font-size="16" font-weight="700" font-family="sans-serif">人工核验与描述指标</text>
  <text x="516" y="631" fill="#7f6a48" font-size="13" font-family="sans-serif">只接真实 ledger；不以 dry-run/mock 代替</text>
  <text x="516" y="658" fill="#a36d24" font-size="12" font-weight="700" font-family="sans-serif">本 run 未就绪 · 等待真实 Step 04 与人工审查</text>

  <path d="M490 626 L422 626" fill="none" stroke="#7187a0" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="62" y="565" width="356" height="122" rx="16" fill="#f6f3fb" stroke="#ab9bd0" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="94" cy="598" r="18" fill="#7c70b4"/><text x="82" y="604" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">06</text>
  <text x="125" y="597" fill="#574785" font-size="16" font-weight="700" font-family="sans-serif">跨文献综合与 FRDI</text>
  <text x="86" y="631" fill="#6b6283" font-size="13" font-family="sans-serif">仅挑战引言中已有的三项方向，不自动生成方向</text>
  <text x="86" y="658" fill="#a04f45" font-size="12" font-weight="700" font-family="sans-serif">本 run 未就绪 · PDF-03/D02 保持未裁定</text>

  <path d="M240 689 L240 727" fill="none" stroke="#7187a0" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="62" y="741" width="1160" height="112" rx="16" fill="#ffffff" stroke="#dce5ed" stroke-width="1.5"/>
  <circle cx="94" cy="779" r="18" fill="#5f819c"/><text x="82" y="785" fill="#fff" font-size="15" font-weight="700" font-family="sans-serif">07</text>
  <text x="125" y="778" fill="#344d67" font-size="16" font-weight="700" font-family="sans-serif">图表、章节输出与版本发布</text>
  <text x="86" y="813" fill="#5d7085" font-size="13" font-family="sans-serif">当前图库可查看历史四图与 v1.2 static-pilot 图2-1/2-3；图2-2/2-4 的 v1.2 对应图尚未生成。</text>
  <text x="86" y="837" fill="#a36d24" font-size="12" font-weight="700" font-family="sans-serif">新 run 图表生成尚未就绪；所有输出需经版本、来源、指标与人工审核</text>

  <rect x="900" y="760" width="292" height="52" rx="10" fill="#f3fbf6" stroke="#c9e2d5"/>
  <text x="918" y="783" fill="#328268" font-size="11" font-weight="700" font-family="sans-serif">全程本地阶段：01 · 02 · BM25部分</text>
  <text x="918" y="801" fill="#607c70" font-size="10" font-family="sans-serif">外部请求需另行披露范围并当次确认</text>
</svg>
